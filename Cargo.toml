[package]
name = "gyeol"
version = "0.0.1"
edition = "2024"
description = "결 (gyeol): a native UI toolkit for Rust, written from scratch on winit, wgpu and cosmic-text"
license = "MIT OR Apache-2.0"
authors = ["eatnows"]
repository = "https://github.com/eatnows/gyeol"
keywords = ["gui", "ui", "wgpu", "text"]
categories = ["gui"]
publish = false

[features]
# PNG output for headless snapshots (`snapshot::Image::save_png`).
snapshot = ["dep:png"]
# SVG icons: `icon(svg)` parses a stroke/fill subset of SVG and rasterizes it crisply at device scale.
svg = ["dep:svgtypes", "dep:roxmltree", "dep:tiny-skia"]

[dependencies]
arboard = { version = "3.6.1", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
png = { version = "0.18", optional = true }
pollster = "1"
roxmltree = { version = "0.20", optional = true }
svgtypes = { version = "0.15", optional = true }
taffy = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std"], optional = true }
wgpu = "30"
winit = "0.30"

# Native window chrome tweaks (traffic lights, vibrancy); versions match what winit 0.30 uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder", "NSVisualEffectView", "NSApplication"] }
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }

[[example]]
name = "snapshot"
required-features = ["snapshot"]

[[example]]
name = "icons"
required-features = ["svg"]
